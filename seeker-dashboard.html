<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="logo.png">
<meta name="theme-color" content="#4facfe">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Jobs | Premium Job Board</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Base & Animated Background */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body {
            min-height: 100vh;
            background: linear-gradient(-45deg, #4facfe, #00f2fe, #f093fb, #f5576c);
            background-size: 400% 400%; animation: gradientBG 15s ease infinite;
            color: #fff; overflow-x: hidden;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Top Navigation Bar */
        nav {
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding: 20px 40px; display: flex; justify-content: space-between; align-items: center;
        }
        .nav-logo { font-size: 1.5rem; font-weight: 700; text-shadow: 0 2px 4px rgba(0,0,0,0.2); }
        .nav-links { display: flex; align-items: center; gap: 20px; }
        .nav-links span { font-weight: 500; opacity: 0.9; }
        .nav-links a {
            color: #fff; text-decoration: none; font-weight: 500;
            background: rgba(255,255,255,0.2); padding: 8px 16px; border-radius: 20px; transition: all 0.3s;
        }
        .nav-links a:hover { background: #fff; color: #1a1a2e; }

        /* Dashboard Container */
        .dashboard-container { padding: 40px; max-width: 1200px; margin: 0 auto; }
        .dashboard-header { margin-bottom: 30px; }
        .dashboard-header h1 { font-size: 2rem; margin-bottom: 5px; }
        .dashboard-header p { opacity: 0.9; }

        /* Job Grid & Cards */
        .job-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; }
        .job-card {
            background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 16px;
            padding: 25px; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        .job-card:hover { transform: translateY(-5px); background: rgba(255, 255, 255, 0.25); box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2); }
        .job-card h3 { font-size: 1.3rem; margin-bottom: 10px; color: #fff; }
        .job-card p { font-size: 0.95rem; opacity: 0.9; margin-bottom: 8px; }
        .apply-btn {
            margin-top: 15px; width: 100%; padding: 12px; border-radius: 12px; font-weight: 600; cursor: pointer;
            border: none; background: #00f2fe; color: #1a1a2e; transition: 0.3s;
        }
        .apply-btn:hover { background: #fff; transform: translateY(-2px); }

        /* Modals Base Styling */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(5px);
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease; z-index: 1000;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        
        .modal-content {
            background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 24px;
            padding: 40px; max-width: 600px; width: 90%; position: relative;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3); transform: translateY(20px); transition: transform 0.3s ease;
        }
        .modal-overlay.active .modal-content { transform: translateY(0); }
        .close-btn { position: absolute; top: 20px; right: 25px; font-size: 1.5rem; cursor: pointer; opacity: 0.7; }
        .close-btn:hover { opacity: 1; }

        /* Seeker Paywall Specifics */
        .modal-content h2 { text-align: center; font-size: 1.8rem; margin-bottom: 5px; }
        .modal-content > p { text-align: center; opacity: 0.9; margin-bottom: 10px; }
        .pricing-cards { display: flex; gap: 20px; margin: 25px 0; }
        .price-card {
            background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255,255,255,0.3);
            border-radius: 16px; padding: 25px; flex: 1; text-align: center; transition: all 0.3s;
        }
        .price-card:hover { transform: translateY(-5px); background: rgba(255, 255, 255, 0.25); box-shadow: 0 8px 25px rgba(0,0,0,0.2); }
        .price-card h3 { font-size: 1.2rem; }
        .price-card .price { font-size: 2rem; font-weight: 700; color: #00f2fe; margin: 15px 0; }
        .price-card p { font-size: 0.9rem; opacity: 0.9; margin-bottom: 20px; }
        
        .btn-buy {
            width: 100%; padding: 12px; border-radius: 12px; font-weight: 600; cursor: pointer; border: none;
            background: #1a1a2e; color: #fff; transition: 0.3s;
        }
        .btn-buy:hover { background: #fff; color: #1a1a2e; }

    </style>
</head>
<body>

    <nav>
        <div class="nav-logo">PremiumTalent</div>
        <div class="nav-links">
            <span id="sub-status">Status: Free Tier</span>
            <a href="#" onclick="logoutUser()">Logout</a>
        </div>
    </nav>

    <div class="dashboard-container">
        <div class="dashboard-header">
            <h1 id="welcome-message">Welcome!</h1>
            <p>Find your next big opportunity.</p>
        </div>

        <!-- Empty grid waiting for real Supabase jobs -->
        <div class="job-grid" id="job-grid">
            <!-- Jobs will be injected here via JavaScript -->
        </div>
    </div>

    <!-- Seeker Paywall Modal -->
    <div class="modal-overlay" id="seeker-paywall">
        <div class="modal-content">
            <span class="close-btn" onclick="closeSeekerPaywall()">&times;</span>
            <h2>Upgrade to Apply</h2>
            <p>Select a plan to instantly send your verified profile to employers.</p>
            
            <div class="pricing-cards">
                <div class="price-card">
                    <h3>Starter</h3>
                    <div class="price">$4.99</div>
                    <p>3 Job Applications</p>
                    <button class="btn-buy" onclick="processSeekerPayment(4.99, 'Starter Plan', this)">Buy Starter</button>
                </div>
                <div class="price-card" style="border-color: #00f2fe; background: rgba(0,242,254,0.1);">
                    <h3>Premium</h3>
                    <div class="price">$25.99</div>
                    <p>Unlimited for 30 Days</p>
                    <button class="btn-buy" onclick="processSeekerPayment(25.99, 'Unlimited Plan', this)">Buy Premium</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        // 1. INITIALIZE SUPABASE
        // REPLACE THESE WITH YOUR ACTUAL KEYS
        const SUPABASE_URL = 'https://ojpijxcqrfhvwgabkaww.supabase.co/rest/v1/';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9qcGlqeGNxcmZodndnYWJrYXd3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxNzc5MDgsImV4cCI6MjEwMzc1MzkwOH0.kd0OPR0J8SzbHxibnqTWGlwBjIiDDAutT1KOqvACvRg';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUserProfile = null;

        // 2. DASHBOARD LOAD & AUTH CHECK
        async function loadSeekerDashboard() {
            const { data: { session } } = await supabase.auth.getSession();

            if (!session) {
                window.location.href = "login.html";
                return;
            }

            // Fetch seeker profile
            const { data: profile } = await supabase
                .from('profiles')
                .select('*')
                .eq('id', session.user.id)
                .single();

            if (profile && profile.full_name) {
                currentUserProfile = profile;
                document.getElementById('welcome-message').innerText = `Welcome, ${profile.full_name}`;
            }

            // Fetch jobs
            fetchJobs();
        }

        // 3. FETCH JOBS FROM DATABASE
        async function fetchJobs() {
            const { data: jobs, error } = await supabase
                .from('jobs')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error("Error fetching jobs:", error);
                return;
            }

            const jobGrid = document.getElementById('job-grid');
            jobGrid.innerHTML = ''; 

            if (jobs.length === 0) {
                jobGrid.innerHTML = '<p>No vacancies available right now. Check back later!</p>';
                return;
            }

            // Generate card for each job
            jobs.forEach(job => {
                const jobCard = document.createElement('div');
                jobCard.className = 'job-card';
                jobCard.innerHTML = `
                    <h3>${job.title}</h3>
                    <p><strong>Company:</strong> ${job.company_name}</p>
                    <p><strong>Location:</strong> ${job.location}</p>
                    <p><strong>Salary:</strong> ${job.salary}</p>
                    <button class="apply-btn" onclick="applyForJob('${job.id}')">1-Click Apply</button>
                `;
                jobGrid.appendChild(jobCard);
            });
        }

        // 4. MODAL LOGIC
        function applyForJob(jobId) {
            document.getElementById('seeker-paywall').classList.add('active');
        }

        function closeSeekerPaywall() {
            document.getElementById('seeker-paywall').classList.remove('active');
        }

        // 5. PAYMENT PROCESSING VIA EDGE FUNCTION
        async function processSeekerPayment(amount, planName, btnElement) {
            btnElement.innerText = "Connecting...";
            btnElement.style.opacity = "0.8";

            const { data: { session } } = await supabase.auth.getSession();
            
            if (!session) {
                alert("Session expired. Please log in.");
                window.location.href = "login.html";
                return;
            }

            try {
                const { data, error } = await supabase.functions.invoke('paynow-checkout', {
                    body: { 
                        user_id: session.user.id, 
                        email: session.user.email,
                        amount: amount,
                        plan_name: planName
                    }
                });

                if (error) throw error;

                if (data && data.redirectUrl) {
                    window.location.href = data.redirectUrl;
                } else {
                    throw new Error("No redirect URL received");
                }
            } catch (error) {
                console.error("Payment Error:", error);
                alert("Failed to initiate payment. Please try again.");
                btnElement.innerText = "Buy " + planName.split(' ')[0];
                btnElement.style.opacity = "1";
            }
        }

        // 6. LOGOUT
        async function logoutUser() {
            await supabase.auth.signOut();
            window.location.href = "index.html";
        }

        // Run immediately on page load
        window.onload = loadSeekerDashboard;
    </script>
     <script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js')
      .then(() => console.log("Service Worker registered successfully."))
      .catch((err) => console.log("Service Worker registration failed:", err));
  }
</script> 
</body>
</html>
