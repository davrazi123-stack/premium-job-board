<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body {
            min-height: 100vh; background-color: #f8fafc; color: #0f172a;
            display: flex; justify-content: center; align-items: center; padding: 20px 0;
        }

        .signup-card {
            background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px;
            padding: 40px; max-width: 450px; width: 90%;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .badge {
            display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 0.75rem;
            font-weight: 700; text-transform: uppercase; margin-bottom: 15px;
        }
        .badge-employment { background: #dbeafe; color: #3b82f6; }
        .badge-housing { background: #d1fae5; color: #10b981; }

        .signup-card h2 { font-size: 1.5rem; margin-bottom: 8px; font-weight: 700; }
        .signup-card p { color: #64748b; margin-bottom: 25px; font-size: 0.9rem; }

        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; font-size: 0.85rem; margin-bottom: 6px; font-weight: 600; color: #475569; }
        .input-group input, .input-group select {
            width: 100%; padding: 10px 14px; border-radius: 8px;
            background: #ffffff; border: 1px solid #cbd5e1;
            color: #0f172a; font-size: 0.95rem; outline: none; transition: border-color 0.2s;
        }
        .input-group input:focus, .input-group select:focus { border-color: #0f172a; }

        .btn-submit {
            width: 100%; padding: 12px; border-radius: 8px; font-size: 0.95rem; font-weight: 600;
            background: #0f172a; color: #fff; border: none; cursor: pointer; transition: background 0.2s; margin-top: 10px;
        }
        .btn-submit:hover { background: #334155; }

        .login-link { margin-top: 20px; font-size: 0.9rem; color: #64748b; text-align: center; }
        .login-link a { color: #0f172a; font-weight: 600; text-decoration: none; }
        .login-link a:hover { text-decoration: underline; }
        
        .back-home { display: block; text-align: center; margin-top: 15px; font-size: 0.85rem; color: #64748b; text-decoration: none; }
        .back-home:hover { color: #0f172a; }
    </style>
</head>
<body>

    <div class="signup-card">
        <div id="portal-badge" class="badge badge-employment">Employment Portal</div>
        <h2>Create an Account</h2>
        <p>Register to get started.</p>
        
        <form id="signup-form">
            <div class="input-group">
                <label>Full Name / Organization Name</label>
                <input type="text" id="full_name" placeholder="John Doe" required>
            </div>

            <div class="input-group">
                <label>I want to sign up as:</label>
                <select id="role-select">
                    <!-- Populated dynamically via JS -->
                </select>
            </div>

            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="name@example.com" required>
            </div>
            
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-submit" id="submit-btn">Sign Up</button>
        </form>

        <div class="login-link">
            Already have an account? <a id="login-redirect" href="login.html">Log in</a>
        </div>
        <a href="index.html" class="back-home">← Back to Portal Selection</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        const SUPABASE_URL = 'https://[YOUR-PROJECT-ID].supabase.co';
        const SUPABASE_ANON_KEY = '[YOUR-ANON-KEY]';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        const portal = urlParams.get('portal') || 'employment';

        const badge = document.getElementById('portal-badge');
        const roleSelect = document.getElementById('role-select');
        const loginRedirect = document.getElementById('login-redirect');

        if (portal === 'housing') {
            badge.className = "badge badge-housing";
            badge.innerText = "Housing Portal";
            loginRedirect.href = `login.html?portal=housing`;
            
            roleSelect.innerHTML = `
                <option value="tenant">Tenant (Looking for a home)</option>
                <option value="landlord">Landlord (Listing a property)</option>
            `;
        } else {
            loginRedirect.href = `login.html?portal=employment`;
            
            roleSelect.innerHTML = `
                <option value="seeker">Job Seeker (Looking for work)</option>
                <option value="employer">Employer (Posting vacancies)</option>
            `;
        }

        document.getElementById('signup-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const fullName = document.getElementById('full_name').value.trim();
            const role = document.getElementById('role-select').value;
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('submit-btn');

            submitBtn.innerText = "Creating account...";
            submitBtn.disabled = true;

            try {
                // Sign up with Supabase Auth and pass metadata for database trigger
                const { data, error } = await supabase.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            full_name: fullName,
                            role: role
                        }
                    }
                });

                if (error) throw error;

                alert("Account created successfully! Please log in.");
                window.location.href = portal === 'housing' ? "login.html?portal=housing" : "login.html?portal=employment";

            } catch (error) {
                console.error("Signup Error:", error);
                alert(error.message || "Registration failed. Please try again.");
                submitBtn.innerText = "Sign Up";
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
