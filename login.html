<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | Premium Job Board</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Base Styles & Animated Background */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body {
            min-height: 100vh; width: 100vw; display: flex; align-items: center; justify-content: center;
            background: linear-gradient(-45deg, #4facfe, #00f2fe, #f093fb, #f5576c);
            background-size: 400% 400%; animation: gradientBG 15s ease infinite; padding: 20px;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Glassmorphism Form Container */
        .auth-card {
            background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 24px; 
            padding: 40px; max-width: 400px; width: 100%;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2); color: #ffffff;
        }

        .auth-card h2 { text-align: center; font-size: 2rem; margin-bottom: 5px; text-shadow: 0 2px 4px rgba(0,0,0,0.2); }
        .auth-card p.subtitle { text-align: center; font-size: 0.95rem; margin-bottom: 30px; opacity: 0.9; }

        /* Form Elements */
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; font-size: 0.95rem; }
        .form-group input {
            width: 100%; padding: 12px 15px; border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.1); color: #fff;
            font-size: 1rem; outline: none; transition: all 0.3s ease;
        }
        .form-group input::placeholder { color: rgba(255, 255, 255, 0.7); }
        .form-group input:focus { border-color: #fff; background: rgba(255, 255, 255, 0.25); }

        /* Submit Button */
        .submit-btn {
            width: 100%; padding: 15px; font-size: 1.1rem; font-weight: 600; margin-top: 10px;
            border-radius: 12px; border: none; cursor: pointer; transition: all 0.3s ease;
            background-color: #1a1a2e; color: #ffffff; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        .submit-btn:hover { background-color: #ffffff; color: #1a1a2e; transform: translateY(-2px); }

        .signup-link { text-align: center; margin-top: 25px; font-size: 0.9rem; }
        .signup-link a { color: #fff; font-weight: 600; text-decoration: none; border-bottom: 1px solid transparent; transition: border 0.3s; }
        .signup-link a:hover { border-bottom: 1px solid #fff; }
    </style>
</head>
<body>

    <div class="auth-card">
        <h2>Welcome Back</h2>
        <p class="subtitle">Log in to your account.</p>

        <form id="login-form">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>
            
            <button type="submit" class="submit-btn">Log In</button>
        </form>

        <div class="signup-link">
            Don't have an account? <a href="index.html">Sign up here</a>
        </div>
    </div>

    <script>
        // Placeholder logic until Supabase Auth is fully connected
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            // We will add the Supabase login code here next.
            alert("Login functionality will be connected shortly!");
        });
    </script>
</body>
</html>
