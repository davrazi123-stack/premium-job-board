<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body {
            min-height: 100vh; background-color: #f8fafc; color: #0f172a;
            display: flex; justify-content: center; align-items: center;
        }

        .login-card {
            background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px;
            padding: 40px; max-width: 420px; width: 90%;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        
        .badge {
            display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 0.75rem;
            font-weight: 700; text-transform: uppercase; margin-bottom: 15px;
        }
        .badge-employment { background: #dbeafe; color: #3b82f6; }
        .badge-housing { background: #d1fae5; color: #10b981; }

        .login-card h2 { font-size: 1.5rem; margin-bottom: 8px; font-weight: 700; }
        .login-card p { color: #64748b; margin-bottom: 25px; font-size: 0.9rem; }

        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; font-size: 0.85rem; margin-bottom: 6px; font-weight: 600; color: #475569; }
        .input-group input {
            width: 100%; padding: 10px 14px; border-radius: 8px;
            background: #ffffff; border: 1px solid #cbd5e1;
            color: #0f172a; font-size: 0.95rem; outline: none; transition: border-color 0.2s;
        }
        .input-group input:focus { border-color: #0f172a; }

        .btn-submit {
            width: 100%; padding: 12px; border-radius: 8px; font-size: 0.95rem; font-weight: 600;
            background: #0f172a; color: #fff; border: none; cursor: pointer; transition: background 0.2s; margin-top: 10px;
        }
        .btn-submit:hover { background: #334155; }

        .signup-link { margin-top: 20px; font-size: 0.9rem; color: #64748b; text-align: center; }
        .signup-link a { color: #0f172a; font-weight: 600; text-decoration: none; }
        .signup-link a:hover { text-decoration: underline; }
        
        .back-home { display: block; text-align: center; margin-top: 15px; font-size: 0.85rem; color: #64748b; text-decoration: none; }
        .back-home:hover { color: #0f172a; }
    </style>
</head>
<body>

    <div class="login-card">
        <div id="portal-badge" class="badge badge-employment">Employment Portal</div>
        <h2>Welcome Back</h2>
        <p>Log in to access your dashboard.</p>
        
        <form id="login-form">
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="name@example.com" required>
            </div>
            
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-submit" id="submit-btn">Log In</button>
        </form>

        <div class="signup-link">
            Don't have an account? <a id="signup-redirect" href="signup.html">Sign up</a>
        </div>
        <a href="index.html" class="back-home">← Back to Portal Selection</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        const SUPABASE_URL = 'https://ojpijxcqrfhvwgabkaww.supabase.co/rest/v1/';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9qcGlqeGNxcmZodndnYWJrYXd3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxNzc5MDgsImV4cCI6MjEwMzc1MzkwOH0.kd0OPR0J8SzbHxibnqTWGlwBjIiDDAutT1KOqvACvRg';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Check which portal the user came from
        const urlParams = new URLSearchParams(window.location.search);
        const portal = urlParams.get('portal') || 'employment';

        // Style badge and links based on portal
        const badge = document.getElementById('portal-badge');
        const signupRedirect = document.getElementById('signup-redirect');
        
        if (portal === 'housing') {
            badge.className = "badge badge-housing";
            badge.innerText = "Housing Portal";
            signupRedirect.href = `signup.html?portal=housing`;
        } else {
            signupRedirect.href = `signup.html?portal=employment`;
        }

        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('submit-btn');

            submitBtn.innerText = "Logging in...";
            submitBtn.disabled = true;

            try {
                const { data: authData, error: authError } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (authError) throw authError;

                const { data: profile, error: profileError } = await supabase
                    .from('profiles')
                    .select('role')
                    .eq('id', authData.user.id)
                    .single();

                if (profileError) throw profileError;

                // Route accurately based on database role
                if (portal === 'housing') {
                    if (profile.role === 'landlord') {
                        window.location.href = "landlord-dashboard.html";
                    } else {
                        window.location.href = "tenant-dashboard.html";
                    }
                } else {
                    if (profile.role === 'employer') {
                        window.location.href = "employer-dashboard.html";
                    } else {
                        window.location.href = "seeker-dashboard.html";
                    }
                }

            } catch (error) {
                console.error("Login Error:", error);
                alert(error.message || "Invalid login credentials. Please try again.");
                submitBtn.innerText = "Log In";
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
