<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="logo.png">
<meta name="theme-color" content="#4facfe">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | Premium Job Board</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body {
            min-height: 100vh;
            background: linear-gradient(-45deg, #4facfe, #00f2fe, #f093fb, #f5576c);
            background-size: 400% 400%; animation: gradientBG 15s ease infinite;
            display: flex; justify-content: center; align-items: center; color: #fff;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .login-card {
            background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 24px;
            padding: 40px; max-width: 420px; width: 90%;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3); text-align: center;
        }
        .login-card h2 { font-size: 2rem; margin-bottom: 5px; }
        .login-card p { opacity: 0.9; margin-bottom: 25px; font-size: 0.9rem; }

        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; font-size: 0.85rem; margin-bottom: 8px; font-weight: 500; }
        .input-group input {
            width: 100%; padding: 12px 15px; border-radius: 12px;
            background: rgba(255, 255, 255, 0.2); border: 1px solid rgba(255, 255, 255, 0.4);
            color: #fff; font-size: 1rem; outline: none; transition: all 0.3s;
        }
        .input-group input::placeholder { color: rgba(255, 255, 255, 0.6); }
        .input-group input:focus { background: rgba(255, 255, 255, 0.3); border-color: #fff; }

        .btn-submit {
            width: 100%; padding: 14px; border-radius: 12px; font-size: 1rem; font-weight: 600;
            background: #fff; color: #1a1a2e; border: none; cursor: pointer; transition: all 0.3s; margin-top: 10px;
        }
        .btn-submit:hover { background: #00f2fe; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }

        .signup-link { margin-top: 20px; font-size: 0.9rem; opacity: 0.9; }
        .signup-link a { color: #fff; font-weight: 600; text-decoration: underline; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Welcome Back</h2>
        <p>Log in to your account.</p>
        
        <form id="login-form">
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="name@example.com" required>
            </div>
            
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-submit" id="submit-btn">Log In</button>
        </form>

        <div class="signup-link">
            Don't have an account? <a href="signup.html">Sign up here</a>
        </div>
    </div>

    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        // Initialize Supabase (Ensure your project URL and anon key are filled in)
        const SUPABASE_URL = 'https://ojpijxcqrfhvwgabkaww.supabase.co/rest/v1/';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9qcGlqeGNxcmZodndnYWJrYXd3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxNzc5MDgsImV4cCI6MjEwMzc1MzkwOH0.kd0OPR0J8SzbHxibnqTWGlwBjIiDDAutT1KOqvACvRg';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('submit-btn');

            submitBtn.innerText = "Logging in...";
            submitBtn.style.opacity = "0.8";

            try {
                // 1. Authenticate user with Supabase Auth
                const { data: authData, error: authError } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (authError) throw authError;

                // 2. Fetch user's role from the profiles table to route them correctly
                const { data: profile, error: profileError } = await supabase
                    .from('profiles')
                    .select('role')
                    .eq('id', authData.user.id)
                    .single();

                if (profileError) throw profileError;

                // 3. Route based on role
                if (profile.role === 'employer') {
                    window.location.href = "employer-dashboard.html";
                } else {
                    window.location.href = "seeker-dashboard.html";
                }

            } catch (error) {
                console.error("Login Error:", error);
                alert(error.message || "Invalid login credentials. Please try again.");
                submitBtn.innerText = "Log In";
                submitBtn.style.opacity = "1";
            }
        });
    </script>
    <script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js')
      .then(() => console.log("Service Worker registered successfully."))
      .catch((err) => console.log("Service Worker registration failed:", err));
  }
</script>
</body>
</html>
