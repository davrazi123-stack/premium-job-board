<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="logo.png">
<meta name="theme-color" content="#4facfe">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome | Discover Exceptional Talent</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* CSS RESET & BASE STYLES */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        /* ANIMATED COLORFUL BACKGROUND */
        body {
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            /* A rich, royal, and vibrant gradient */
            background: linear-gradient(-45deg, #4facfe, #00f2fe, #f093fb, #f5576c);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            overflow: hidden;
        }

        /* Background Animation Keyframes */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* GLASSMORPHISM CARD */
        .welcome-card {
            background: rgba(255, 255, 255, 0.15); /* Semi-transparent white */
            backdrop-filter: blur(15px); /* The frosted glass effect */
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 24px;
            padding: 50px 40px;
            max-width: 600px;
            width: 90%;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
            color: #ffffff;
            transition: transform 0.3s ease;
        }

        .welcome-card:hover {
            transform: translateY(-5px);
        }

        /* TYPOGRAPHY */
        .welcome-card h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 15px;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .welcome-card p {
            font-size: 1.1rem;
            font-weight: 400;
            margin-bottom: 40px;
            line-height: 1.6;
            text-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        /* BUTTON LAYOUT */
        .button-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap; /* Allows buttons to stack on small mobile screens */
        }

        /* BUTTON STYLING */
        .btn {
            text-decoration: none;
            padding: 15px 35px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            width: 220px;
        }

        /* Employer Button - Royal Dark Theme */
        .btn-employer {
            background-color: #1a1a2e;
            color: #ffffff;
            border: 2px solid transparent;
        }

        .btn-employer:hover {
            background-color: transparent;
            border: 2px solid #1a1a2e;
            color: #1a1a2e;
            background-color: rgba(255, 255, 255, 0.9);
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.4);
        }

        /* Seeker Button - Bright & Energetic Theme */
        .btn-seeker {
            background-color: #ffffff;
            color: #f5576c;
            border: 2px solid transparent;
        }

        .btn-seeker:hover {
            background-color: transparent;
            border: 2px solid #ffffff;
            color: #ffffff;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.4);
        }

        /* MOBILE RESPONSIVENESS */
        @media (max-width: 600px) {
            .welcome-card h1 {
                font-size: 2rem;
            }
            .btn {
                width: 100%; /* Make buttons full width on small screens */
            }
        }
    </style>
</head>
<body>

    <div class="welcome-card">
        <h1>Welcome to the Future.</h1>
        <p>A warm welcome to our platform. Whether you are building an elite team or searching for your dream role, your next great chapter begins right here. Tell us who you are to begin.</p>
        
        <div class="button-container">
            <a href="signup.html?type=employer" class="btn btn-employer">I am an Employer</a>
            <a href="signup.html?type=seeker" class="btn btn-seeker">I am a Job Seeker</a>
        </div>
    </div>
  <script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js')
      .then(() => console.log("Service Worker registered successfully."))
      .catch((err) => console.log("Service Worker registration failed:", err));
  }
</script> 
</body>
</html>
